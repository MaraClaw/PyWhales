name: Run tests

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  render-docs:
    name: Render docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.14.10"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: prepare
        run: uv run --locked python -m docs.autogen
      - name: Render
        run: uv run --locked mkdocs build --config-file docs/mkdocs.yml
      - id: site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delivery-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: site
          include-hidden-files: true
          if-no-files-found: error
    outputs:
      artifact_id: ${{ steps.site.outputs.artifact-id }}
      artifact_digest: ${{ steps.site.outputs.artifact-digest }}

  build-linux-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.14.10"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run all checks
        run: |
          uv run --locked ruff check ./
          uv run --locked ruff format --check ./
          uv run --locked ty check

  build-linux-test-component:
    strategy:
      fail-fast: false
      matrix:
        component:
          - buildx
          - test_compose.py
          - test_config.py
          - test_container.py
          - test_context.py
          - test_image.py
          - test_manifest.py
          - test_network.py
          - test_node.py
          - test_plugin.py
          - test_service.py
          - test_stack.py
          - test_swarm.py
          - test_system.py
          - test_task.py
          - test_volume.py
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.14.10"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Setup Docker
        run: |
          ./scripts/ci-setup.sh
      - name: Run tests
        run: |
          uv run --locked pytest -vv --no-runtime-skip --durations=10 tests/pywhales/components/${{ matrix.component }}

  build-linux-test-other:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.14.10"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Setup Docker
        run: |
          ./scripts/ci-setup.sh
      - name: Run tests
        run: |
          uv run --locked pytest -vv --no-runtime-skip --durations=10 --ignore=tests/pywhales/components/

  build-linux-test-coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.14.10"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Setup Docker
        run: |
          ./scripts/ci-setup.sh
      - name: Run full strict suite with coverage
        run: uv run --locked coverage run -m pytest -vv -ra --no-runtime-skip --durations=10
      - name: Enforce coverage threshold
        run: uv run --locked coverage report

  build-linux-test-modern:
    name: Compose and Buildx smoke tests
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.14.10"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Install verified Linux plugins
        run: ./scripts/download-docker-plugins.sh
      - name: Run required real CLI smoke tests
        run: >-
          uv run --locked pytest -vv -rs --no-runtime-skip --durations=10
          tests/pywhales/components/test_docker_modern_integration.py

  build-linux-test-modern-arm64:
    name: Compose and Buildx ARM64 smoke tests
    timeout-minutes: 10
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert native ARM64 host and Docker engine
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          test "$RUNNER_ARCH" = ARM64
          test "$(docker version --format '{{.Server.Arch}}')" = arm64
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.14.10"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Install verified Linux plugins
        run: ./scripts/download-docker-plugins.sh
      - name: Run required real CLI smoke tests
        run: >-
          uv run --locked pytest -vv -rs --no-runtime-skip --durations=10
          tests/pywhales/components/test_docker_modern_integration.py

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.14.10"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Setup Docker
        shell: pwsh
        run: |
          Start-Service -Name docker -ErrorAction Stop
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            docker info
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -lt 12) {
              Start-Sleep -Seconds 5
            }
          }
          throw "Docker API did not become ready after 12 attempts (5 seconds apart). Last docker info exit code: $LASTEXITCODE"
      - name: Run single test
        run: |
          uv run --locked pytest -vv --no-runtime-skip tests/pywhales/components/test_volume.py::test_simple_volume

  build-distributions:
    name: Build tested distributions
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.dist.outputs.artifact-id }}
      artifact_digest: ${{ steps.dist.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.14.10"
      - run: uv build --no-sources --sdist --wheel
      - name: Isolate-install both exact distributions
        run: uv run --locked python -m scripts.delivery smoke
      - id: dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delivery-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error

  delivery-eligible:
    name: Seal tested delivery
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - render-docs
      - build-linux-lint
      - build-linux-test-component
      - build-linux-test-other
      - build-linux-test-coverage
      - build-linux-test-modern
      - build-linux-test-modern-arm64
      - build-windows
      - build-distributions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.14.10"
      - name: Seal exact uploader identities after every required check
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          DIST_ARTIFACT_ID: ${{ needs.build-distributions.outputs.artifact_id }}
          DIST_ARTIFACT_DIGEST: ${{ needs.build-distributions.outputs.artifact_digest }}
          SITE_ARTIFACT_ID: ${{ needs.render-docs.outputs.artifact_id }}
          SITE_ARTIFACT_DIGEST: ${{ needs.render-docs.outputs.artifact_digest }}
        run: uv run --locked python -m scripts.delivery seal --run-id "$GITHUB_RUN_ID" --output delivery-seal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delivery-seal-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery-seal/seal.json
          if-no-files-found: error
